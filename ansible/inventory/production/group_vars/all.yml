---
# ==========================================
# 1. Server & System Settings
# ==========================================
timezone: "Asia/Tehran"
ssh_port: 22
deploy_user: "deploy"

# ==========================================
# 2. Container Registry Auth (GHCR is public)
# ==========================================
registry_auth_enabled: false
registry_url: "ghcr.io"
registry_username: ""
registry_token: ""

# ==========================================
# 3. Application Stack
# ==========================================
app_name: "persu"
app_dir: "/opt/app"
docker_swarm_task_history_limit: 1
app_prune_images_until: "24h"

# Persistent named volumes
app_named_volumes:
  - "postgres_data"

# Application services
app_services:
  - name: "db"
    image: "postgres:17-alpine"
    replicas: 1
    auto_update: false
    update_order: "stop-first"
    placement_constraints:
      - "node.role == manager"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-persu}"]
      interval: "10s"
      timeout: "5s"
      retries: 5
      start_period: "20s"
    resources:
      reservations:
        cpus: "0.25"
        memory: "256M"
      limits:
        cpus: "1.0"
        memory: "1024M"
    env:
      POSTGRES_DB: "persu"
      POSTGRES_USER: "persu"
      POSTGRES_PASSWORD: "iggbJTLg-8jw-NaN7jmLmGzxJq5jQK09"
    volumes:
      - "postgres_data:/var/lib/postgresql/data"

  - name: "redis"
    image: "redis:7-alpine"
    replicas: 1
    auto_update: false
    update_order: "stop-first"
    placement_constraints:
      - "node.role == manager"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: "10s"
      timeout: "3s"
      retries: 5
    resources:
      reservations:
        cpus: "0.10"
        memory: "64M"
      limits:
        cpus: "0.50"
        memory: "256M"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    env: {}
    volumes: []

  - name: "backend"
    image: "ghcr.io/ehmoeini/persu-backend:latest"
    replicas: 2
    auto_update: false
    update_order: "start-first"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\" || exit 1"]
      interval: "15s"
      timeout: "5s"
      retries: 3
      start_period: "30s"
    resources:
      reservations:
        cpus: "0.25"
        memory: "256M"
      limits:
        cpus: "1.0"
        memory: "768M"
    command: ["sh", "-c", "until python -c \"import socket; s = socket.create_connection(('db', 5432), timeout=2); s.close()\" 2>/dev/null; do echo 'Waiting for postgres...'; sleep 1; done; exec gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers ${GUNICORN_WORKERS:-3} --timeout ${GUNICORN_TIMEOUT:-60} --access-logfile - --error-logfile -"]
    volumes: []
    env:
      DB_ENGINE: "postgresql"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_NAME: "persu"
      DB_USER: "persu"
      DB_PASSWORD: "iggbJTLg-8jw-NaN7jmLmGzxJq5jQK09"
      REDIS_URL: "redis://redis:6379/1"
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: "Qz-TxjH5h95qZA3mpD2v24J7U-q5a1irmNiy2gKmSh5EOI4wlce7xiRMrYLsuPgvI1g"
      AUTH_JWT_SECRET: "hWANj0PxgKpzAEwOVBBBFkF_MTQgRC6cWHzt6x77UdJ0LEFXXNe48SZeYFfk3WrFW84"
      DJANGO_ALLOWED_HOSTS: "api.persu.fpna.ir,persu.fpna.ir,192.168.6.222,localhost,127.0.0.1"
      DJANGO_BEHIND_PROXY: "true"
      CSRF_TRUSTED_ORIGINS: "https://persu.fpna.ir,https://api.persu.fpna.ir,http://persu.fpna.ir:3000,http://api.persu.fpna.ir:8000,http://192.168.6.222:3000,http://192.168.6.222:8000"
      CORS_ALLOWED_ORIGINS: "https://persu.fpna.ir,http://persu.fpna.ir:3000,http://192.168.6.222:3000"
      AUTH_JWT_ISSUER: "https://api.persu.fpna.ir"
      AUTH_JWT_AUDIENCE: "https://persu.fpna.ir"
      PORT: "8000"
      GUNICORN_WORKERS: "3"
      GUNICORN_TIMEOUT: "60"

  - name: "frontend"
    image: "ghcr.io/ehmoeini/persu-frontend:latest"
    replicas: 2
    auto_update: true
    update_order: "start-first"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: "15s"
      timeout: "5s"
      retries: 3
      start_period: "25s"
    resources:
      reservations:
        cpus: "0.25"
        memory: "128M"
      limits:
        cpus: "0.75"
        memory: "512M"
    volumes: []
    env:
      NODE_ENV: "production"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_BASE_URL: "https://api.persu.fpna.ir"
