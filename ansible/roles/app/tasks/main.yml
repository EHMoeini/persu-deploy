---
# ==============================================================================
# Step 1: Pre-Flight Validation & Deployment Concurrency Lock
# ==============================================================================
- name: "Preflight: Check for active deployment lock"
  ansible.builtin.stat:
    path: "/var/run/deploykit-{{ app_name }}.lock"
  register: deploy_lock_stat

- name: "Fail if concurrent deployment is already in progress"
  ansible.builtin.fail:
    msg: >-
      [DEPLOYMENT LOCK ERROR] Lock file '/var/run/deploykit-{{ app_name }}.lock' already exists!
      Another deployment or migration is currently executing against this environment.
      If a previous deployment crashed, verify cluster state and remove the lock file manually.
  when: deploy_lock_stat.stat.exists

- name: "Deployment execution block"
  block:
    - name: "Acquire deployment lock"
      ansible.builtin.copy:
        dest: "/var/run/deploykit-{{ app_name }}.lock"
        content: "Locked by DeployKit for {{ app_name }} at {{ ansible_date_time.iso8601 | default('now') }}\n"
        mode: "0644"

    - name: "Preflight: Validate required deployment variables"
      ansible.builtin.assert:
        that:
          - app_name is defined and app_name | length > 0
          - app_dir is defined and app_dir | length > 0
          - app_services is defined and app_services | length > 0
        fail_msg: "Required variables app_name, app_dir, or app_services are missing."

    - name: "Ensure Python dependencies for Docker Swarm (jsondiff, pyyaml) are installed"
      block:
        - name: "Install python3-jsondiff via system package manager"
          ansible.builtin.package:
            name:
              - python3-jsondiff
              - python3-yaml
            state: present
      rescue:
        - name: "Install jsondiff via pip fallback if distro package is missing"
          ansible.builtin.pip:
            name:
              - jsondiff
              - PyYAML
            state: present
            extra_args: "--break-system-packages"
          ignore_errors: true

    - name: "Ensure application directory exists"
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ deploy_user | default(ansible_user) }}"
        group: "{{ deploy_user | default(ansible_user) }}"
        mode: "0750"

    - name: "Ensure Docker Swarm is initialized with tight task history retention"
      community.docker.docker_swarm:
        state: present
        advertise_addr: "{{ ansible_host | default(ansible_default_ipv4.address) }}"
        task_history_retention_limit: "{{ docker_swarm_task_history_limit | default(1) }}"

    - name: "Ensure application overlay network exists"
      community.docker.docker_network:
        name: "{{ app_name }}_internal"
        driver: overlay
        attachable: true
        state: present

    # ==============================================================================
    # Step 2: Container Registry Login & Image Preparation
    # ==============================================================================
    - name: "Log in to Container Registry (GHCR / DockerHub) if private"
      community.docker.docker_login:
        registry_url: "{{ registry_url }}"
        username: "{{ registry_username }}"
        password: "{{ registry_token }}"
        reauthorize: true
      when:
        - registry_auth_enabled | bool
        - registry_username | length > 0
        - registry_token | length > 0
      no_log: true

    - name: "Identify backend service configuration"
      ansible.builtin.set_fact:
        backend_service: "{{ (app_services | selectattr('name', 'equalto', 'backend') | list | first) | default(none) }}"

    - name: "Pull latest backend image for pre-deployment migrations"
      community.docker.docker_image:
        name: "{{ backend_service.image }}"
        source: pull
        force_source: true
      when: backend_service is not none

    - name: "Render application docker-stack.yml"
      ansible.builtin.template:
        src: docker-stack.yml.j2
        dest: "{{ app_dir }}/docker-stack.yml"
        owner: "{{ deploy_user | default(ansible_user) }}"
        group: "{{ deploy_user | default(ansible_user) }}"
        mode: "0640"

    # ==============================================================================
    # Step 3 & 4: Django Database Migrations (Decoupled Pre-Deployment Task)
    # ==============================================================================
    - name: "Execute database migrations block"
      when: backend_service is not none
      block:
        - name: "Check if database service is running in Docker Swarm"
          ansible.builtin.command: >-
            docker service ls --filter name={{ app_name }}_db --format "{% raw %}{{.Name}}{% endraw %}"
          register: db_service_check
          changed_when: false
          failed_when: false

        - name: "Bootstrap stack for database initialization (initial cold start)"
          when: db_service_check.stdout == ""
          block:
            - name: "Bootstrap stack using community.docker.docker_stack"
              community.docker.docker_stack:
                state: present
                name: "{{ app_name }}"
                compose:
                  - "{{ app_dir }}/docker-stack.yml"
                resolve_image: always
                with_registry_auth: "{{ registry_auth_enabled | bool }}"
          rescue:
            - name: "Bootstrap stack using docker stack CLI fallback"
              ansible.builtin.command: >-
                docker stack deploy
                --compose-file {{ app_dir }}/docker-stack.yml
                --resolve-image always
                {% if registry_auth_enabled | bool %}--with-registry-auth{% endif %}
                {{ app_name }}

        - name: "Define unique migration container name"
          ansible.builtin.set_fact:
            migration_container_name: "{{ app_name }}_migration_{{ ansible_date_time.epoch | default('run') }}"

        - name: "Run Django database migrations in a temporary one-off container"
          community.docker.docker_container:
            name: "{{ migration_container_name }}"
            image: "{{ backend_service.image }}"
            state: started
            detach: false
            auto_remove: false
            networks:
              - name: "{{ app_name }}_internal"
            env: "{{ backend_service.env | default({}) }}"
            command:
              - sh
              - -c
              - >-
                until python -c "import os, socket; s = socket.create_connection((os.environ.get('DB_HOST') or 'db', int(os.environ.get('DB_PORT') or 5432)), timeout=2); s.close()" 2>/dev/null; do
                  echo "Waiting for database to accept connections...";
                  sleep 1;
                done;
                python manage.py migrate --noinput

          register: migration_result
          failed_when: false
          no_log: true

        - name: "Capture migration container logs on failure"
          ansible.builtin.command: "docker logs {{ migration_container_name }}"
          register: migration_logs
          when:
            - migration_result.container.State.ExitCode is defined
            - migration_result.container.State.ExitCode != 0
          failed_when: false
          changed_when: false

        - name: "Display migration failure output"
          ansible.builtin.debug:
            var: migration_logs.stdout_lines
          when:
            - migration_result.container.State.ExitCode is defined
            - migration_result.container.State.ExitCode != 0

        - name: "Cleanup temporary migration container"
          community.docker.docker_container:
            name: "{{ migration_container_name }}"
            state: absent
          failed_when: false

        - name: "Assert database migration succeeded"
          ansible.builtin.assert:
            that:
              - migration_result.container.State.ExitCode is defined
              - migration_result.container.State.ExitCode == 0
            fail_msg: >-
              [MIGRATION FAILED] Database migration container exited with code {{ migration_result.container.State.ExitCode | default('unknown') }}.
              Aborting deployment! The running backend Swarm service has NOT been updated.
            success_msg: "[MIGRATION SUCCESS] Database migrations completed successfully."

    # ==============================================================================
    # Step 5: Deploy / Rolling-Update Application Stack to Docker Swarm
    # ==============================================================================
    - name: "Deploy application stack to Docker Swarm"
      when: app_services | length > 0
      block:
        - name: "Deploy application stack using community.docker.docker_stack"
          community.docker.docker_stack:
            state: present
            name: "{{ app_name }}"
            compose:
              - "{{ app_dir }}/docker-stack.yml"
            prune: true
            resolve_image: always
            with_registry_auth: "{{ registry_auth_enabled | bool }}"
      rescue:
        - name: "Deploy application stack using docker stack CLI fallback"
          ansible.builtin.command: >-
            docker stack deploy
            --compose-file {{ app_dir }}/docker-stack.yml
            --prune
            --resolve-image always
            {% if registry_auth_enabled | bool %}--with-registry-auth{% endif %}
            {{ app_name }}

    # ==============================================================================
    # Step 6: Wait for Rolling Updates to Complete & Detect Rollbacks
    # ==============================================================================
    - name: "Allow Swarm scheduler to initiate service updates"
      ansible.builtin.pause:
        seconds: 5

    - name: "Wait until all Swarm rolling updates finish"
      ansible.builtin.shell: |
        set -o pipefail
        ids=$(docker stack services -q {{ app_name }})
        if [ -n "$ids" ]; then
          docker service inspect --format '{% raw %}{{.Spec.Name}}|{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}none{{end}}{% endraw %}' $ids
        fi
      args:
        executable: /bin/bash
      register: swarm_update_states
      until: >-
        swarm_update_states.stdout_lines | length > 0 and
        (swarm_update_states.stdout_lines | select('search', '\\|(updating|rollback_started)$') | list | length == 0)
      retries: 40
      delay: 5
      changed_when: false

    - name: "Fail if any service paused or rolled back during update"
      ansible.builtin.assert:
        that:
          - (swarm_update_states.stdout_lines | select('search', '\\|(paused|rollback_completed)$') | list | length) == 0
        fail_msg: >-
          [ROLLING UPDATE FAILED] One or more Swarm services paused or rolled back:
          {{ swarm_update_states.stdout_lines }}

    - name: "Verify all Swarm services reached desired replica counts"
      ansible.builtin.command: >-
        docker service ls
        --filter label=com.docker.stack.namespace={{ app_name }}
        --format "{% raw %}{{.Name}}: {{.Replicas}}{% endraw %}"
      register: swarm_services_status
      until: >-
        swarm_services_status.stdout_lines | length > 0 and
        (swarm_services_status.stdout_lines | reject('search', '^.*:\\s*([0-9]+)/\\1$') | list | length == 0)
      retries: 20
      delay: 5
      changed_when: false

    # ==============================================================================
    # Step 7: Cleanup Dead Containers & Stale Images
    # ==============================================================================
    - name: "Remove dead/stopped Swarm task containers"
      ansible.builtin.command: docker container prune -f
      register: container_prune_out
      changed_when: "'Total reclaimed space: 0B' not in container_prune_out.stdout"

    - name: "Remove unused Docker images older than {{ app_prune_images_until | default('24h') }}"
      ansible.builtin.command: >-
        docker image prune -a -f --filter "until={{ app_prune_images_until | default('24h') }}"
      register: image_prune_out
      changed_when: "'Total reclaimed space: 0B' not in image_prune_out.stdout"

    - name: "Report deployment success and verified service replicas"
      ansible.builtin.debug:
        msg:
          - "========================================================================"
          - "Application Stack '{{ app_name }}' Deployed Successfully to Docker Swarm"
          - "========================================================================"
          - "{{ swarm_services_status.stdout_lines }}"

  always:
    - name: "Release deployment lock"
      ansible.builtin.file:
        path: "/var/run/deploykit-{{ app_name }}.lock"
        state: absent
