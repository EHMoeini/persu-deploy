---
- name: "Check if Docker is already installed"
  ansible.builtin.command: docker --version
  register: docker_installed_check
  changed_when: false
  failed_when: false

- name: "Install Docker on Debian-family distributions"
  when:
    - ansible_os_family == "Debian"
    - docker_installed_check.rc != 0
  block:
    - name: "Ensure APT keyrings directory exists"
      ansible.builtin.file:
        path: "{{ docker_apt_keyring_dir }}"
        state: directory
        mode: '0755'

    - name: "Attempt to download official Docker GPG key"
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: "{{ docker_apt_keyring_path }}"
        mode: '0644'
      register: docker_gpg_download
      ignore_errors: true

    - name: "Configure official Docker repository when accessible"
      when: docker_gpg_download is succeeded
      block:
        - name: "Add official Docker APT repository"
          ansible.builtin.apt_repository:
            repo: >-
              deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
              signed-by={{ docker_apt_keyring_path }}]
              https://download.docker.com/linux/{{ ansible_distribution | lower }}
              {{ ansible_distribution_release }} stable
            state: present
            filename: docker

        - name: "Fix interrupted dpkg state and remove conflicting distro packages"
          ansible.builtin.shell: |
            dpkg --configure -a || true
            apt-get remove -y docker-compose-v2 docker.io || true
          changed_when: false

        - name: "Install official Docker Engine and Docker Compose Plugin packages"
          ansible.builtin.apt:
            name: "{{ docker_packages }}"
            state: present
            update_cache: true
            dpkg_options: 'force-confdef,force-confold,force-overwrite'

    - name: "Install Docker from distribution repository if official repository is geo-blocked (HTTP 403)"
      when: docker_gpg_download is failed
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - docker-buildx
        state: present
        update_cache: true

- name: "Install Docker on RedHat-family distributions"
  when:
    - ansible_os_family == "RedHat"
    - docker_installed_check.rc != 0
  block:
    - name: "Install Docker and Docker Compose on Amazon Linux"
      when: ansible_distribution == "Amazon"
      block:
        - name: "Install Docker package via DNF on Amazon Linux"
          ansible.builtin.dnf:
            name: docker
            state: present

        - name: "Ensure Docker CLI plugins directory exists"
          ansible.builtin.file:
            path: /usr/local/lib/docker/cli-plugins
            state: directory
            mode: '0755'

        - name: "Install Docker Compose v2 CLI plugin binary on Amazon Linux"
          ansible.builtin.get_url:
            url: "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-{{ ansible_architecture }}"
            dest: /usr/local/lib/docker/cli-plugins/docker-compose
            mode: '0755'

    - name: "Install Docker CE and Compose plugin on RHEL-compatible distributions"
      when: ansible_distribution != "Amazon"
      block:
        - name: "Add Docker CE repository"
          ansible.builtin.get_url:
            url: "https://download.docker.com/linux/rhel/docker-ce.repo"
            dest: /etc/yum.repos.d/docker-ce.repo
            mode: '0644'

        - name: "Install Docker CE and Compose plugin packages via DNF"
          ansible.builtin.dnf:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-compose-plugin
            state: present

- name: "Ensure Docker configuration directory exists"
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: '0755'

- name: "Configure Docker daemon registry mirrors for geo-blocked environments"
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "registry-mirrors": [
          "https://docker.iranserver.com",
          "https://docker.arvancloud.ir",
          "https://docker.m1r.ir",
          "https://registry.docker.ir"
        ]
      }
    mode: '0644'

- name: "Reload systemd configuration"
  ansible.builtin.systemd:
    daemon_reload: true

- name: "Ensure docker.socket and docker.service are enabled and restarted with active mirrors"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    enabled: true
  loop:
    - docker.socket
    - docker.service

- name: "Add designated users to docker group"
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
